server:
  port: 28761

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  file:
    name: .run/logs/${spring.application.name}.log
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [${spring.application.name}] [trace=%X{traceId}] %logger{32} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [trace=%X{traceId}] %logger{32} - %msg%n"
