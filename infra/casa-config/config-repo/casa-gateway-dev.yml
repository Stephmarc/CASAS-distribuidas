server:
  port: 28080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:28090/realms/casa-o-nada}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:28090/realms/casa-o-nada/protocol/openid-connect/certs}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: operaciones-ms
              uri: lb://casa-orden-ms
              predicates:
                - Path=/api/v1/operaciones/**
            - id: notificacion-ms
              uri: lb://casa-notificacion-ms
              predicates:
                - Path=/api/v1/notificaciones/**
            - id: orden-ms
              uri: lb://casa-orden-ms
              predicates:
                - Path=/api/v1/ordenes/**
            - id: cliente-ms
              uri: lb://casa-cliente-ms
              predicates:
                - Path=/api/v1/clientes/**
            - id: propiedad-ms
              uri: lb://casa-propiedad-ms
              predicates:
                - Path=/api/v1/propiedades/**
            - id: agente-ms
              uri: lb://casa-agente-ms
              predicates:
                - Path=/api/v1/agentes/**
            - id: visita-ms
              uri: lb://casa-visita-ms
              predicates:
                - Path=/api/v1/visitas/**
            - id: reserva-ms
              uri: lb://casa-reserva-ms
              predicates:
                - Path=/api/v1/reservas/**
            - id: pago-ms
              uri: lb://casa-pago-ms
              predicates:
                - Path=/api/v1/pagos/**
            - id: contrato-ms
              uri: lb://casa-contrato-ms
              predicates:
                - Path=/api/v1/contratos/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:28761/eureka
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  file:
    name: .run/logs/${spring.application.name}.log
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [${spring.application.name}] [trace=%X{traceId}] %logger{32} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [trace=%X{traceId}] %logger{32} - %msg%n"
