server.port=18888
spring.application.name=casa-config
eureka.client.service-url.defaultZone=http://localhost:18761/eureka

# Activa el perfil nativo (archivos locales)
spring.profiles.active=native
# Le dice dónde está la carpeta con los archivos de configuración
spring.cloud.config.server.native.search-locations=file:./config-repo