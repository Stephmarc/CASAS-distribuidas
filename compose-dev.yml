name: casa-o-nada-dev
services:
  postgres:
    image: postgres:16-alpine
    container_name: casa-o-nada-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: casa
      POSTGRES_PASSWORD: casa
    ports:
      - "15440:5432"
    volumes:
      - casa_o_nada_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casa -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  db-init:
    image: postgres:16-alpine
    container_name: casa-o-nada-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: casa
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for db in casa_propiedad casa_agente casa_visita casa_reserva casa_pago casa_contrato; do
          exists=$$(psql -h postgres -U casa -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'")
          if [ "$$exists" != "1" ]; then
            echo "Creando base de datos $$db"
            psql -h postgres -U casa -d postgres -c "CREATE DATABASE $$db OWNER casa"
          else
            echo "Base de datos $$db ya existe"
          fi
        done
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: casa-o-nada-keycloak-dev
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "18090:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

volumes:
  casa_o_nada_pgdata:
