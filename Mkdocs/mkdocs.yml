site_name: CASAS · Casa o Nada
site_description: Plataforma inmobiliaria distribuida · Grupo 9
site_author: Jannys Navarro · Olger Meza · Miguel Angel Alanguia
site_url: https://stephmarc.github.io/CASAS-distribuidas/
repo_url: https://github.com/Stephmarc/CASAS-distribuidas
theme:
  name: material
  language: es
  palette:
    primary: teal
    accent: amber
  features: [navigation.sections, navigation.top, content.code.copy]
nav:
  - Inicio: index.md
  - Unidad I:
      - Sistema distribuido base: unidad1.md
  - Unidad II:
      - Producto de unidad: u2-producto.md
      - S06 · Comunicación resiliente: s06.md
      - S07 · Seguridad y Keycloak: s07.md
      - S08 · Mensajería asíncrona: s08.md
      - S09 · Consistencia distribuida: s09.md
      - S10 · Observabilidad: s10.md
      - S11 · Frontend Angular: s11.md
      - Evidencias: evidencias.md
      - Sustentación S12: sustentacion.md
      - Guía para presentar: guia-demo.md
  - Ejecutar y publicar: ejecucion.md
  - Antecedentes:
      - Feign inicial: tarea-1-feign-circuit-breaker.md
      - JWT inicial: tarea-2-jwt.md
      - Mensajería inicial: tarea-3-mensajeria.md
      - Saga inicial: tarea-4-saga.md
      - Estabilización: estabilizacion.md
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
