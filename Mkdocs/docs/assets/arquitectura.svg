<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">Arquitectura de CASAS</title><desc id="desc">Angular usa Gateway para acceder a nueve microservicios. Keycloak autentica, Eureka descubre y Config Server configura. Kafka coordina eventos; cada dominio tiene base propia y Grafana reúne métricas y logs.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#597b78" stroke-width="1.3"/></marker></defs><rect width="1120" height="760" rx="20" fill="#faf7f0"/><g font-family="Arial,sans-serif" fill="#153e40"><text x="40" y="47" font-size="27" font-weight="bold">CASAS · Operación inmobiliaria distribuida</text><text x="40" y="76" font-size="17" fill="#667674">Compra y alquiler · identidad, eventos y seguimiento de cada operación</text></g><g stroke="#597b78" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M355 150H455"/><path d="M210 186V215H815V186"/><path d="M560 186V325H200V352"/><path d="M560 325V352"/><path d="M560 325H920V352"/><path d="M200 465V516"/><path d="M560 465V516"/><path d="M920 465V516"/><path d="M315 250H405"/><path d="M920 573V623H560V661"/><path d="M200 573V623H550"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#153e40"><rect x="65" y="114" width="290" height="73" rx="13"/><rect x="455" y="114" width="210" height="73" rx="13"/><rect x="750" y="114" width="285" height="73" rx="13"/></g><g fill="white" font-size="24" font-weight="bold"><text x="210" y="145">Angular</text><text x="560" y="145">Gateway</text><text x="892" y="145">Keycloak</text></g><g fill="#d4e5df" font-size="16"><text x="210" y="172">Catálogo · sesión · operaciones</text><text x="560" y="172">API única del cliente</text><text x="892" y="172">Code + PKCE S256 · JWT</text></g><text x="405" y="135" font-size="15" fill="#657571">REST</text><text x="520" y="211" font-size="15" fill="#657571">Autenticación del navegador</text><g fill="#e0eae5" stroke="#b1c9c1"><rect x="65" y="224" width="250" height="63" rx="11"/><rect x="405" y="224" width="310" height="63" rx="11"/><rect x="805" y="224" width="230" height="63" rx="11"/></g><g fill="#153e40" font-size="21" font-weight="bold"><text x="190" y="251">Eureka</text><text x="560" y="251">Config Server</text><text x="920" y="251">Feign + Circuit Breaker</text></g><g fill="#526c66" font-size="15"><text x="190" y="273">Registro y descubrimiento</text><text x="560" y="273">Configuración por aplicación</text><text x="920" y="273">Lecturas entre servicios</text></g><g fill="white" stroke="#b9cbc5" stroke-width="2"><rect x="45" y="352" width="310" height="113" rx="13"/><rect x="405" y="352" width="310" height="113" rx="13"/><rect x="765" y="352" width="310" height="113" rx="13"/></g><g fill="#153e40" font-size="22" font-weight="bold"><text x="200" y="386">Propiedad · Agente · Visita</text><text x="560" y="386">Cliente · Reserva · Orden</text><text x="920" y="386">Pago · Contrato · Avisos</text></g><g fill="#657571" font-size="17"><text x="200" y="417">Catálogo y agenda</text><text x="200" y="443">JWT validado en cada servicio</text><text x="560" y="417">Proceso inmobiliario y saga</text><text x="560" y="443">JWT y pertenencia al cliente</text><text x="920" y="417">Adelanto, contrato y notificación</text><text x="920" y="443">Transacciones locales</text></g><g fill="#e0eae5"><rect x="45" y="516" width="310" height="58" rx="11"/><rect x="405" y="516" width="310" height="58" rx="11"/><rect x="765" y="516" width="310" height="58" rx="11"/></g><g fill="#153e40" font-size="19"><text x="200" y="552">PostgreSQL · 3 bases propias</text><text x="560" y="552">PostgreSQL · 3 bases propias</text><text x="920" y="552">PostgreSQL · 3 bases propias</text></g><rect x="45" y="663" width="520" height="66" rx="13" fill="#153e40"/><text x="305" y="691" fill="white" font-size="23" font-weight="bold">Kafka · casa.operaciones.v1</text><text x="305" y="715" fill="#d4e5df" font-size="16">Outbox / inbox · idempotencia · compensaciones</text><rect x="615" y="663" width="460" height="66" rx="13" fill="#eddfc2"/><text x="845" y="691" fill="#6b542a" font-size="22" font-weight="bold">Prometheus · Loki · Grafana</text><text x="845" y="715" fill="#6b542a" font-size="16">Métricas y logs correlacionados por traceId</text><text x="565" y="610" fill="#657571" font-size="16">Cada cambio de dominio y su evento se confirman juntos en su base local.</text></g></svg>
