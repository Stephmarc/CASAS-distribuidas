spring:
  application:
    name: casa-propiedad-ms
  profiles:
    active: dev
  config:
    import: "optional:configserver:http://localhost:18888"

---
spring:
  config:
    activate:
      on-profile: dev
      
  # Aquí va la configuración de seguridad (indentado bajo spring)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18090/realms/casa-o-nada
          
  # Aquí va la base de datos
  datasource:
    url: jdbc:postgresql://localhost:15440/propiedad_db
    username: casa
    password: casa
    driver-class-name: org.postgresql.Driver
    
  # Aquí va JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true